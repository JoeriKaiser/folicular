# LOCAL DEVELOPMENT ONLY - not a production deployment.
#
# This publishes the API on a host port with no TLS and no invite gate, which
# is right for a laptop and wrong for a VPS. For Coolify use the Dockerfile
# build pack (see docs/deployment.md), or docker-compose.prod.yml if you deploy
# with the Docker Compose build pack.
#
#   docker compose up -d --build        # build the image and start
#   docker compose logs -f folicular    # follow the structured JSON logs
#   docker compose ps                   # health status
#   docker compose down                 # stop (keeps the database volume)
#   docker compose down -v              # stop and wipe the database
#
# The Android device reaches the server through the published HOST port
# (container always listens on 8080):
#   emulator    -> http://10.0.2.2:8080
#   real device -> adb reverse tcp:8080 tcp:<host port>, then
#                  http://127.0.0.1:8080  (or the host's LAN IP)
#
# If the default host port 8080 is already taken on your machine, override it:
#   FOLICULAR_HOST_PORT=18080 docker compose up -d --build
#   adb reverse tcp:8080 tcp:18080
services:
  folicular:
    build:
      context: .
      args:
        VERSION: docker-dev
    image: folicular:dev
    container_name: folicular
    environment:
      FOLICULAR_ADDR: ":8080"
      FOLICULAR_DB_PATH: /data/folicular.db
      FOLICULAR_LOG_LEVEL: info
      # Duo pairing links are not exercised by the cycles-only trial.
      FOLICULAR_PAIRING_BASE_URL: "https://luteal-duo.waldemar.site"
    ports:
      - "${FOLICULAR_HOST_PORT:-8080}:8080"
    volumes:
      - folicular-data:/data
    restart: unless-stopped

volumes:
  folicular-data:
